<!DOCTYPE html>
<html>
<head>
    <title>RL Controller Test</title>
</head>
<body>
    <h1>RL Controller Test</h1>
    <div id="status">Loading...</div>
    <div id="output"></div>
    
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const statusDiv = document.getElementById('status');
            const outputDiv = document.getElementById('output');
            
            function log(message) {
                console.log(message);
                outputDiv.innerHTML += '<p>' + message + '</p>';
            }
            
            try {
                statusDiv.textContent = 'Loading ONNX Runtime...';
                
                // Try to load ONNX Runtime
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.15.1/dist/ort.min.js';
                
                const ortLoaded = new Promise((resolve, reject) => {
                    script.onload = () => {
                        if (window.ort) {
                            log('ONNX Runtime loaded successfully');
                            resolve(true);
                        } else {
                            reject(new Error('ONNX Runtime not available'));
                        }
                    };
                    script.onerror = () => reject(new Error('Failed to load ONNX Runtime'));
                });
                
                document.head.appendChild(script);
                await ortLoaded;
                
                statusDiv.textContent = 'Loading ONNX model...';
                
                // Try to load the ONNX model
                const modelPath = './examples/models/baseline.onnx';
                const response = await fetch(modelPath);
                if (!response.ok) {
                    throw new Error(`Model file not found: ${response.status}`);
                }
                
                const modelBuffer = await response.arrayBuffer();
                log(`Model loaded, size: ${modelBuffer.byteLength} bytes`);
                
                // Create ONNX session
                const session = await window.ort.InferenceSession.create(modelBuffer, {
                    executionProviders: ['wasm']
                });
                
                log('ONNX session created successfully');
                log(`Input names: ${session.inputNames.join(', ')}`);
                log(`Output names: ${session.outputNames.join(', ')}`);
                
                // Get input shape info
                if (session.inputNames.length > 0) {
                    const inputName = session.inputNames[0];
                    const inputMetadata = session.inputMetadata[inputName];
                    if (inputMetadata && inputMetadata.dims) {
                        log(`Expected input shape: [${inputMetadata.dims.join(', ')}]`);
                        log(`Expected observation size: ${inputMetadata.dims[1]}`);
                    }
                }
                
                // Test inference with dummy data
                const obsSize = 210;
                const dummyObs = new Float32Array(obsSize);
                for (let i = 0; i < obsSize; i++) {
                    dummyObs[i] = Math.random() * 0.1; // Small random values
                }
                
                const inputTensor = new window.ort.Tensor('float32', dummyObs, [1, obsSize]);
                const inputs = {};
                inputs[session.inputNames[0]] = inputTensor;
                
                log('Running test inference...');
                const startTime = performance.now();
                const outputMap = await session.run(inputs);
                const inferenceTime = performance.now() - startTime;
                
                const output = outputMap[session.outputNames[0]];
                log(`Inference completed in ${inferenceTime.toFixed(2)}ms`);
                log(`Output shape: [${output.dims.join(', ')}]`);
                log(`Output data sample: [${Array.from(output.data.slice(0, 5)).map(x => x.toFixed(3)).join(', ')}]`);
                
                statusDiv.textContent = 'Test completed successfully!';
                statusDiv.style.color = 'green';
                
            } catch (error) {
                log(`Error: ${error.message}`);
                statusDiv.textContent = 'Test failed';
                statusDiv.style.color = 'red';
            }
        });
    </script>
</body>
</html>
