<!DOCTYPE html>
<html>
<head>
    <title>Observation Space Test</title>
</head>
<body>
    <h1>Observation Space Analysis</h1>
    <div id="output"></div>
    
    <script type="module">
        import { RLController } from './examples/rlUtils.js';
        
        function log(message) {
            console.log(message);
            document.getElementById('output').innerHTML += '<p>' + message + '</p>';
        }
        
        // Mock MuJoCo simulation data based on typical bimanual arm
        const mockSimulation = {
            qpos: new Float32Array(105).fill(0).map((_, i) => Math.sin(i * 0.1) * 0.1), // 105 joint positions
            qvel: new Float32Array(105).fill(0).map((_, i) => Math.cos(i * 0.1) * 0.05), // 105 joint velocities
            actuator_length: new Float32Array(80).fill(0).map((_, i) => i * 0.01),
            actuator_velocity: new Float32Array(80).fill(0).map((_, i) => i * 0.005),
            actuator_force: new Float32Array(80).fill(0).map((_, i) => i * 0.001),
            xpos: new Float32Array(150).fill(0).map((_, i) => i * 0.01), // Body positions
            xvel: new Float32Array(150).fill(0).map((_, i) => i * 0.005), // Body velocities
            ctrl: new Float32Array(80).fill(0)
        };
        
        const mockModel = {
            nq: 105,    // Typical for bimanual arms
            nv: 105,    // Same as nq for most joints
            nu: 80,     // Number of actuators
            nbody: 50,  // Number of bodies
            njnt: 105,  // Number of joints
            names: new Uint8Array(1000).fill(0),
            name_bodyadr: new Uint32Array(50).fill(0),
            name_actuatoradr: new Uint32Array(80).fill(0)
        };
        
        try {
            log('Testing observation space generation...');
            
            const controller = new RLController();
            controller.debug = true;
            
            // Test observation generation
            const obs = controller.getObservation(mockSimulation, mockModel);
            
            log(`Generated observation size: ${obs.length}`);
            log(`Expected size: 210`);
            log(`Size match: ${obs.length === 210 ? 'YES' : 'NO'}`);
            
            if (obs.length > 0) {
                const sampleSize = 10;
                const sample = Array.from(obs.slice(0, sampleSize)).map(v => v.toFixed(3));
                log(`Observation sample (first ${sampleSize}): [${sample.join(', ')}]`);
                
                const lastSample = Array.from(obs.slice(-sampleSize)).map(v => v.toFixed(3));
                log(`Observation sample (last ${sampleSize}): [${lastSample.join(', ')}]`);
            }
            
            // Check for NaN or infinite values
            let hasInvalid = false;
            for (let i = 0; i < obs.length; i++) {
                if (!isFinite(obs[i])) {
                    hasInvalid = true;
                    log(`Invalid value at index ${i}: ${obs[i]}`);
                }
            }
            
            if (!hasInvalid) {
                log('✓ All observation values are valid');
            }
            
            // Test action application with mock data
            log('\nTesting action application...');
            const mockAction = new Float32Array(80).fill(0).map((_, i) => Math.sin(i * 0.1) * 0.5);
            
            controller.applyAction(mockSimulation, mockAction);
            
            log(`Applied ${mockAction.length} actions to ${mockSimulation.ctrl.length} controls`);
            
            const ctrlSample = Array.from(mockSimulation.ctrl.slice(0, 5)).map(v => v.toFixed(3));
            log(`Control sample: [${ctrlSample.join(', ')}]`);
            
            log('\n✓ Observation/action space test completed successfully!');
            
        } catch (error) {
            log(`Error: ${error.message}`);
            console.error(error);
        }
    </script>
</body>
</html>
